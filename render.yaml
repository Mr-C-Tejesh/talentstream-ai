services:
  # FastAPI Backend
  - type: web
    name: talentstream-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render Dashboard
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard

  # Streamlit Frontend
  - type: web
    name: talentstream-ui
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE_URL
        value: https://talentstream-api.onrender.com # Change after deployment
